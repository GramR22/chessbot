<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChessBot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #1a1a1a;
            color: #f0f0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 { font-size: 2rem; margin-bottom: 24px; letter-spacing: 2px; }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 68px);
            grid-template-rows: repeat(8, 68px);
            border: 3px solid #444;
        }

        .square {
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            cursor: pointer;
            user-select: none;
        }

        .light { background: #f0d9b5; }
        .dark  { background: #b58863; }
        .selected { background: #7fc97f !important; }

        .wp, .wn, .wb, .wr, .wq, .wk {
            color: #fff;
            text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000;
        }

        .bp, .bn, .bb, .br, .bq, .bk {
            color: #1a1a1a;
            text-shadow: 0 0 3px #888;
        }

        #status {
            margin-top: 20px;
            font-size: 1.1rem;
            min-height: 1.5em;
        }

        .yourturn { color: #56c26a; }
        .thinking { color: #f0b429; }
        .gameover { color: #e05c5c; }

        button {
            margin-top: 20px;
            padding: 10px 28px;
            font-size: 1rem;
            font-family: monospace;
            background: #333;
            color: #f0f0f0;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        button:hover { background: #444; }
    </style>
</head>
<body>
    <h1>ChessBot</h1>
    <div id="board"></div>
    <div id="status" class="yourturn">Your turn — play as White</div>
    <button onclick="resetGame()">New Game</button>

    <script>
        const GLYPHS = {
            P: '♙', N: '♘', B: '♗', R: '♖', Q: '♕', K: '♔',
            p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚'
        };

        const FILES = 'abcdefgh';
        let boardState = {};
        let selected = null;
        let waiting = false;
        let gameOver = false;

        function parseFen(fen) {
            const state = {};
            const rows = fen.split(' ')[0].split('/');
            for (let rank = 0; rank < 8; rank++) {
                let file = 0;
                for (const ch of rows[rank]) {
                    if (ch >= '1' && ch <= '8') {
                        file += parseInt(ch);
                    } else {
                        state[FILES[file] + (8 - rank)] = ch;
                        file++;
                    }
                }
            }
            return state;
        }

        function renderBoard(fen) {
            boardState = parseFen(fen);
            const board = document.getElementById('board');
            board.innerHTML = '';

            for (let rank = 7; rank >= 0; rank--) {
                for (let file = 0; file < 8; file++) {
                    const sq = FILES[file] + (rank + 1);
                    const light = (file + rank) % 2 === 1;
                    const piece = boardState[sq];

                    const div = document.createElement('div');
                    div.className = 'square ' + (light ? 'light' : 'dark');
                    div.dataset.sq = sq;

                    if (piece) {
                        div.textContent = GLYPHS[piece];
                        const color = piece === piece.toUpperCase() ? 'w' : 'b';
                        div.classList.add(color + piece.toLowerCase());
                    }

                    if (selected === sq) {
                        div.classList.add('selected');
                    }

                    div.addEventListener('click', () => onClick(sq));
                    board.appendChild(div);
                }
            }
        }

        function setStatus(msg, cls) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = cls || '';
        }

        function onClick(sq) {
            if (waiting || gameOver) {
                return;
            }

            const piece = boardState[sq];
            const isWhite = piece && piece === piece.toUpperCase();

            if (!selected) {
                if (isWhite) {
                    selected = sq;
                    renderBoard(currentFen());
                }
                return;
            }

            if (sq === selected) {
                selected = null;
                renderBoard(currentFen());
                return;
            }

            if (isWhite) {
                selected = sq;
                renderBoard(currentFen());
                return;
            }

            const from = selected;
            selected = null;
            sendMove(from, sq);
        }

        function currentFen() {
            // reconstruct FEN from boardState for re-render purposes
            // we store the last server FEN instead
            return lastFen;
        }

        let lastFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

        function sendMove(from, to) {
            let uci = from + to;
            if (boardState[from] === 'P' && to[1] === '8') {
                uci += 'q';
            }

            waiting = true;
            setStatus('Bot is thinking...', 'thinking');

            fetch('/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ move: uci })
            })
            .then(r => r.json())
            .then(data => {
                waiting = false;
                if (data.error) {
                    setStatus('Illegal move, try again', 'gameover');
                    renderBoard(lastFen);
                    return;
                }
                lastFen = data.fen;
                renderBoard(data.fen);
                if (data.game_over) {
                    gameOver = true;
                    setStatus('Game over: ' + data.result, 'gameover');
                } else {
                    setStatus('Your turn, play as White', 'yourturn');
                }
            })
            .catch(() => {
                waiting = false;
                setStatus('Error, try again', 'gameover');
                renderBoard(lastFen);
            });
        }

        function resetGame() {
            fetch('/reset', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                lastFen = data.fen;
                selected = null;
                waiting = false;
                gameOver = false;
                renderBoard(data.fen);
                setStatus('Your turn, play as White', 'yourturn');
            });
        }

        renderBoard(lastFen);
    </script>
</body>
</html>
